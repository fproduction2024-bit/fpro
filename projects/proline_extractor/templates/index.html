<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proline KPI Range Exporter</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --bg: #f5f7fa;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text: #333;
            --text-light: #666;
            --success: #2ecc71;
            --error: #e74c3c;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 20% 30%, #e1e8f0 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, #d6e0ed 0%, transparent 40%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--primary);
        }

        p.subtitle {
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            font-size: 14px;
            line-height: 1.5;
        }

        .status.success {
            display: block;
            background-color: rgba(46, 204, 113, 0.1);
            color: #1e8449;
            border: 1px solid rgba(46, 204, 113, 0.2);
        }

        .status.error {
            display: block;
            background-color: rgba(231, 76, 60, 0.1);
            color: #943126;
            border: 1px solid rgba(231, 76, 60, 0.2);
        }

        .status.running {
            display: block;
            background-color: rgba(74, 144, 226, 0.1);
            color: var(--primary);
            border: 1px solid rgba(74, 144, 226, 0.2);
        }

        .links {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .links a {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, .3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Proline KPI Exporter</h1>
        <p class="subtitle">集計期間を指定してGoogle Sheetsへエクスポートします</p>

        <div class="form-group">
            <label for="days_from">何日前から (Days from)</label>
            <input type="number" id="days_from" value="45" min="0">
        </div>

        <div class="form-group">
            <label for="days_to">何日前まで (Days to)</label>
            <input type="number" id="days_to" value="15" min="0">
        </div>

        <button id="export_btn">
            <span id="btn_text">エクスポートを実行</span>
        </button>

        <div id="status_box" class="status"></div>

        <div class="links">
            <a href="https://docs.google.com/spreadsheets/d/1rp4glyfA1-ni3tdFWlbPnXepLx0uVSYt8l1c7hqI1ic/edit"
                target="_blank">
                📊 Google Spreadsheet を開く
            </a>
        </div>
    </div>

    <script>
        const exportBtn = document.getElementById('export_btn');
        const btnText = document.getElementById('btn_text');
        const statusBox = document.getElementById('status_box');
        const daysFromInput = document.getElementById('days_from');
        const daysToInput = document.getElementById('days_to');

        exportBtn.addEventListener('click', async () => {
            const daysFrom = daysFromInput.value;
            const daysTo = daysToInput.value;

            // Update UI to running state
            exportBtn.disabled = true;
            statusBox.className = 'status running';
            statusBox.innerHTML = '抽出を実行中... (約30秒〜1分ほどかかります)';
            btnText.innerHTML = '<span class="loader"></span> 実行中...';

            try {
                const response = await fetch('/api/export_range', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        days_from: parseInt(daysFrom),
                        days_to: parseInt(daysTo)
                    }),
                });

                const result = await response.json();

                if (result.status === 'success') {
                    statusBox.className = 'status success';
                    statusBox.innerHTML = '成功: データをスプレッドシートに追加しました！';
                } else {
                    statusBox.className = 'status error';
                    statusBox.innerHTML = 'エラー: ' + result.message;
                }
            } catch (error) {
                statusBox.className = 'status error';
                statusBox.innerHTML = 'エラー: サーバーとの通信に失敗しました。';
                console.error(error);
            } finally {
                exportBtn.disabled = false;
                btnText.innerHTML = 'エクスポートを実行';
            }
        });
    </script>
</body>

</html>
