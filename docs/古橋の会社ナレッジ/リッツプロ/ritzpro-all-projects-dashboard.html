<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リッツプロ — 全案件ダッシュボード</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+JP:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --forest: #2a4418;
            --forest-light: #345520;
            --forest-lighter: #3d6626;
            --gold: #BC9B5D;
            --gold-light: #D4B87A;
            --gold-dim: rgba(188, 155, 93, 0.15);
            --cream: #FCF8ED;
            --sage: #E0E7D9;
            --brown: #675045;
            --white: #f0efe8;
            --gray: #8a8878;
            --bg: #1a1a14;
            --card: #232318;
            --border: #3a3a2e;
            --green: #5A8A35;
            --blue: #6b9cd4;
            --red: #c45a4a;
            --orange: #c98a4c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            background: var(--bg);
            color: var(--white);
            line-height: 1.7;
            min-height: 100vh;
        }

        /* ── Header ── */
        .top-header {
            background: linear-gradient(135deg, var(--forest) 0%, #1e3512 50%, var(--bg) 100%);
            border-bottom: 1px solid var(--border);
            padding: 32px 48px;
            position: relative;
            overflow: hidden;
        }

        .top-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(188, 155, 93, 0.08) 0%, transparent 60%);
        }

        .header-content {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-brand h1 {
            font-family: 'Noto Serif JP', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-brand p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        .header-meta {
            text-align: right;
            font-size: 12px;
            color: var(--gray);
        }

        .header-meta .date-display {
            font-size: 14px;
            color: var(--gold-light);
            font-weight: 600;
            margin-bottom: 2px;
        }

        /* ── Main ── */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 48px;
        }

        /* ── KPI Cards ── */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 36px;
        }

        .kpi-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .kpi-card:hover {
            border-color: var(--gold);
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .kpi-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 80px;
            height: 80px;
            border-radius: 0 16px 0 60px;
            opacity: 0.08;
        }

        .kpi-card:nth-child(1)::after {
            background: var(--gold);
        }

        .kpi-card:nth-child(2)::after {
            background: var(--green);
        }

        .kpi-card:nth-child(3)::after {
            background: var(--blue);
        }

        .kpi-card:nth-child(4)::after {
            background: var(--orange);
        }

        .kpi-label {
            font-size: 12px;
            color: var(--gray);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .kpi-value {
            font-family: 'Inter', sans-serif;
            font-size: 44px;
            font-weight: 800;
            margin: 8px 0 4px;
        }

        .kpi-card:nth-child(1) .kpi-value {
            color: var(--gold);
        }

        .kpi-card:nth-child(2) .kpi-value {
            color: var(--green);
        }

        .kpi-card:nth-child(3) .kpi-value {
            color: var(--blue);
        }

        .kpi-card:nth-child(4) .kpi-value {
            color: var(--orange);
        }

        .kpi-sub {
            font-size: 12px;
            color: var(--gray);
        }

        /* ── Section Headers ── */
        .section-title {
            font-family: 'Noto Serif JP', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--white);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .section-title .icon {
            font-size: 22px;
        }

        /* ── View Toggle ── */
        .view-toggle {
            display: flex;
            gap: 4px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 3px;
        }

        .view-btn {
            padding: 8px 20px;
            border: none;
            background: none;
            color: var(--gray);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .view-btn.active {
            background: var(--gold-dim);
            color: var(--gold);
        }

        .view-btn:hover:not(.active) {
            color: var(--white);
        }

        /* ── Filter Bar ── */
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .filter-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .chip {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--gray);
            transition: all 0.2s;
        }

        .chip:hover {
            border-color: var(--gold);
            color: var(--white);
        }

        .chip.active {
            background: var(--gold-dim);
            border-color: var(--gold);
            color: var(--gold);
        }

        /* ── Table View ── */
        .project-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 32px;
        }

        .project-table th {
            background: var(--forest);
            color: var(--gold);
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 600;
            text-align: left;
            border: 1px solid var(--border);
            white-space: nowrap;
            position: sticky;
            top: 0;
        }

        .project-table td {
            padding: 14px 16px;
            border: 1px solid var(--border);
            font-size: 13px;
            background: var(--card);
            transition: all 0.2s;
        }

        .project-table tr:hover td {
            background: var(--forest);
        }

        .project-table .client-name {
            font-weight: 600;
            color: var(--white);
            font-size: 14px;
        }

        .project-table .client-desc {
            font-size: 11px;
            color: var(--gray);
            margin-top: 2px;
        }

        /* ── Card View ── */
        .project-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-bottom: 36px;
        }

        .project-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .project-card:hover {
            border-color: var(--gold);
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        }

        .clickable-card {
            cursor: pointer;
        }

        .clickable-card:hover {
            border-color: var(--gold);
            box-shadow: 0 16px 40px rgba(188, 155, 93, 0.15), 0 0 0 1px var(--gold);
        }

        .clickable-card::after {
            content: '↗ ダッシュボードを開く';
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 10px;
            color: var(--gold);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .clickable-card:hover::after {
            opacity: 1;
        }

        .clickable-row:hover {
            background: rgba(188, 155, 93, 0.08) !important;
            cursor: pointer;
        }

        .project-card .card-phase-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }

        .project-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .project-card .card-icon-wrap {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: var(--gold-dim);
        }

        .project-card .card-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 4px;
        }

        .project-card .card-company {
            font-size: 12px;
            color: var(--gray);
        }

        .project-card .card-meta {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .project-card .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--gray);
        }

        .project-card .card-progress {
            margin-top: 16px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.6s ease;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 11px;
            color: var(--gray);
        }

        .project-card .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .action-link {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            border: 1px solid var(--border);
            color: var(--gray);
            background: transparent;
        }

        .action-link:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .action-link.primary {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        .action-link.primary:hover {
            background: var(--gold-light);
        }

        /* ── Status Badges ── */
        .status-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-badge.phase0 {
            background: rgba(107, 156, 212, 0.15);
            color: var(--blue);
        }

        .status-badge.phase1 {
            background: var(--gold-dim);
            color: var(--gold);
        }

        .status-badge.phase2 {
            background: rgba(90, 138, 53, 0.15);
            color: var(--green);
        }

        .status-badge.phase3 {
            background: rgba(201, 138, 76, 0.15);
            color: var(--orange);
        }

        .status-badge.active {
            background: rgba(90, 138, 53, 0.15);
            color: var(--green);
        }

        .status-badge.paused {
            background: rgba(138, 135, 120, 0.15);
            color: var(--gray);
        }

        /* ── Pipeline ── */
        .pipeline-section {
            margin-bottom: 36px;
        }

        .pipeline-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 16px;
            margin-bottom: 12px;
            align-items: start;
        }

        .pipeline-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--white);
            padding: 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pipeline-label .p-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .pipeline-cards {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pipeline-chip {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--white);
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pipeline-chip:hover {
            border-color: var(--gold);
            transform: translateY(-2px);
        }

        .pipeline-chip .p-icon {
            font-size: 16px;
        }

        /* ── Timeline ── */
        .timeline-section {
            margin-bottom: 36px;
        }

        .timeline {
            position: relative;
            padding-left: 28px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 4px;
            bottom: 4px;
            width: 2px;
            background: var(--border);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 20px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 8px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            background: var(--bg);
        }

        .timeline-item .tl-date {
            font-size: 11px;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .timeline-item .tl-content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
        }

        .timeline-item .tl-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--white);
            margin-bottom: 4px;
        }

        .timeline-item .tl-desc {
            font-size: 12px;
            color: var(--gray);
        }

        .timeline-item .tl-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 8px;
        }

        /* ── Resources ── */
        .resource-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            margin-bottom: 36px;
        }

        .resource-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            text-decoration: none;
            color: var(--white);
            transition: all 0.2s;
        }

        .resource-card:hover {
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .resource-card .r-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .resource-card .r-name {
            font-size: 13px;
            font-weight: 600;
        }

        .resource-card .r-url {
            font-size: 11px;
            color: var(--gray);
            margin-top: 2px;
            word-break: break-all;
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            padding: 40px 0 24px;
            color: var(--gray);
            font-size: 11px;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--gray);
        }

        /* ── Responsive ── */
        @media (max-width: 1024px) {
            .kpi-row {
                grid-template-columns: repeat(2, 1fr);
            }

            .main-container {
                padding: 24px;
            }

            .top-header {
                padding: 24px;
            }
        }

        @media (max-width: 768px) {
            .kpi-row {
                grid-template-columns: 1fr;
            }

            .project-cards {
                grid-template-columns: 1fr;
            }

            .pipeline-row {
                grid-template-columns: 1fr;
            }

            .resource-grid {
                grid-template-columns: 1fr;
            }

            .header-content {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .header-meta {
                text-align: center;
            }

            .main-container {
                padding: 16px;
            }

            .top-header {
                padding: 20px 16px;
            }

            .kpi-value {
                font-size: 36px;
            }
        }

        /* ── Animations ── */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeInUp 0.4s ease forwards;
        }
    </style>
</head>

<body>

    <!-- ══════ Header ══════ -->
    <header class="top-header">
        <div class="header-content">
            <div class="header-brand">
                <h1>🌿 リッツプロ 全案件ダッシュボード</h1>
                <p>伴走型FC事業支援 — 全クライアント案件の一元管理</p>
            </div>
            <div class="header-meta">
                <div class="date-display" id="today-date"></div>
                <div>Last Updated: <span id="last-updated"></span></div>
            </div>
        </div>
    </header>

    <!-- ══════ Main ══════ -->
    <div class="main-container">

        <!-- ── KPI Summary ── -->
        <div class="kpi-row" id="kpi-row"></div>

        <!-- ── Projects Section ── -->
        <div class="filter-bar">
            <h2 class="section-title" style="margin-bottom:0; border-bottom:none;"><span class="icon">📋</span> 案件一覧
            </h2>
            <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
                <div class="filter-chips" id="phase-filters"></div>
                <div class="view-toggle">
                    <button class="view-btn active" data-view="card" onclick="switchView('card')">カード</button>
                    <button class="view-btn" data-view="table" onclick="switchView('table')">テーブル</button>
                </div>
            </div>
        </div>

        <!-- Card View -->
        <div class="project-cards" id="card-view"></div>

        <!-- Table View -->
        <div id="table-view" style="display:none;">
            <table class="project-table">
                <thead>
                    <tr>
                        <th>案件名</th>
                        <th>法人名</th>
                        <th>代表者</th>
                        <th>業種</th>
                        <th>フェーズ</th>
                        <th>ステータス</th>
                        <th>進捗</th>
                        <th>契約月</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>

        <!-- ── Pipeline View ── -->
        <h2 class="section-title"><span class="icon">🔀</span> フェーズ別パイプライン</h2>
        <div class="pipeline-section" id="pipeline-view"></div>

        <!-- ── Activity Timeline ── -->
        <h2 class="section-title"><span class="icon">📰</span> 最近のアクティビティ</h2>
        <div class="timeline-section">
            <div class="timeline" id="timeline-view"></div>
        </div>

        <!-- ── Resources ── -->
        <h2 class="section-title"><span class="icon">🔗</span> リソース・リンク集</h2>
        <div class="resource-grid" id="resource-grid"></div>

        <div class="footer">
            <p>リッツプロ 全案件ダッシュボード — Powered by Ritz PRO × F Production</p>
            <p style="margin-top:4px;">© 2026 株式会社リッツ・PRO / Fプロダクション</p>
        </div>
    </div>

    <script>
        // ══════ CONFIG ══════
        // Google Sheets連携: 下記にスプレッドシートIDを設定すると、Sheetsからリアルタイムでデータを読み込みます。
        // 空の場合はフォールバック（ハードコード）データを使用します。
        // 設定方法: Sheetsを「ウェブに公開」→ URLからIDをコピー
        const SHEET_ID = '1a2ShhbjJ8QNFk24cqevU4dimqPjZsw9ctDY0eIlK1Yg'; // リッツプロ案件管理シート

        // ══════ COLORS ══════
        const C_GREEN = '#5A8A35';
        const C_GOLD = '#BC9B5D';
        const C_BLUE = '#6b9cd4';
        const C_ORANGE = '#c98a4c';
        const PHASE_COLORS = { 0: C_BLUE, 1: C_GOLD, 2: C_GREEN, 3: C_ORANGE };
        const TAG_COLORS = { '制作物': C_GREEN, 'デプロイ': C_GREEN, '提案': C_GOLD, '戦略': C_GOLD, '契約': C_BLUE, 'リサーチ': C_BLUE, 'MTG': C_ORANGE };

        // ══════ PHASES (constant) ══════
        const PHASES = [
            { id: 0, label: 'Phase 0: ヒアリング', color: C_BLUE, icon: '🔍' },
            { id: 1, label: 'Phase 1: 本部構築', color: C_GOLD, icon: '🏗️' },
            { id: 2, label: 'Phase 2: 加盟店募集', color: C_GREEN, icon: '📣' },
            { id: 3, label: 'Phase 3: 運用・拡大', color: C_ORANGE, icon: '🚀' }
        ];

        // ══════ GOOGLE SHEETS FETCH ══════
        function sheetCsvUrl(sheetName) {
            return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
        }

        function parseCsv(text) {
            const lines = [];
            let current = '', inQuote = false, row = [];
            for (let i = 0; i < text.length; i++) {
                const ch = text[i], next = text[i + 1];
                if (inQuote) {
                    if (ch === '"' && next === '"') { current += '"'; i++; }
                    else if (ch === '"') { inQuote = false; }
                    else { current += ch; }
                } else {
                    if (ch === '"') { inQuote = true; }
                    else if (ch === ',') { row.push(current.trim()); current = ''; }
                    else if (ch === '\n' || (ch === '\r' && next === '\n')) {
                        row.push(current.trim()); current = '';
                        if (row.some(c => c !== '')) lines.push(row);
                        row = [];
                        if (ch === '\r') i++;
                    } else { current += ch; }
                }
            }
            row.push(current.trim());
            if (row.some(c => c !== '')) lines.push(row);
            return lines;
        }

        function csvToObjects(text) {
            const lines = parseCsv(text);
            if (lines.length < 2) return [];
            const headers = lines[0];
            return lines.slice(1).map(row => {
                const obj = {};
                headers.forEach((h, i) => { obj[h] = row[i] || ''; });
                return obj;
            });
        }

        async function fetchSheet(sheetName) {
            const res = await fetch(sheetCsvUrl(sheetName));
            if (!res.ok) throw new Error(`Sheet "${sheetName}" fetch failed: ${res.status}`);
            return csvToObjects(await res.text());
        }

                    company: r['法人名'],

                    industry: r['業種'],
                    icon: r['アイコン'] || '📋',

                    console.log(`✅ Google Sheets読込完了: ${PROJECTS.length}案件, ${TIMELINE_EVENTS.length}イベント`);

            document.getElementById('last-updated').textContent = now.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        // ── KPIs ──
        function renderKPIs() {
            const total = PROJECTS.length;

            const kpis = [

        </div>
    `).join('');
        }

        // ── Phase Filters ──
        function renderPhaseFilters() {
            const counts = { all: PROJECTS.length };

            let html = `<span class="chip active" data-filter="all" onclick="filterPhase('all')">すべて (${counts.all})</span>`;
            PHASES.forEach(ph => {
                html += `<span class="chip" data-filter="${ph.id}" onclick="filterPhase(${ph.id})">${ph.icon} ${ph.label.split(': ')[1]} (${counts[ph.id]})</span>`;
            });
            document.getElementById('phase-filters').innerHTML = html;
        }

        function filterPhase(phase) {
            activePhaseFilter = phase;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            document.querySelector(`.chip[data-filter="${phase}"]`).classList.add('active');
            renderCards();
            renderTable();
        }

        function getFilteredProjects() {
            if (activePhaseFilter === 'all') return PROJECTS;
            return PROJECTS.filter(p => p.phase === activePhaseFilter);
        }

        // ── View Toggle ──
        function switchView(view) {
            activeView = view;
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.view-btn[data-view="${view}"]`).classList.add('active');
            document.getElementById('card-view').style.display = view === 'card' ? 'grid' : 'none';
            document.getElementById('table-view').style.display = view === 'table' ? 'block' : 'none';
